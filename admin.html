<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Ana Júlia Modas</title>
<style>
:root{font-family:Arial,sans-serif;color:#403039;--rose:#b83d74}*{box-sizing:border-box}body{margin:0;background:#fff7fa}header{background:#902b59;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:21px;margin:0}header small{font-size:12px}main{max-width:1160px;margin:26px auto;padding:0 16px}.panel{background:white;padding:22px;border:1px solid #f0dfe7;border-radius:12px;margin-bottom:18px}h2{margin:0 0 14px;color:#9b3365;font-size:20px}h3{font-size:16px}input,textarea,select{width:100%;font:inherit;padding:11px;border-radius:6px;border:1px solid #d9c7ce;background:#fff}textarea{min-height:88px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}button{cursor:pointer;background:var(--rose);color:white;border:0;border-radius:5px;padding:11px 14px}button.secondary{background:#6b5862}button.danger{background:#9b273d}button:disabled{opacity:.55;cursor:not-allowed}.layout{display:grid;grid-template-columns:210px 1fr;gap:16px}.menu{display:flex;flex-direction:column;gap:7px}.menu button{text-align:left;background:#fff;color:#7f335a;border:1px solid #eed2df}.menu button.active{background:#b83d74;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:10px}.item strong{display:block}.item small{color:#786a70}.item button{padding:8px 10px}.item img{width:56px;height:56px;object-fit:cover;border-radius:6px}.preview{max-width:190px;max-height:150px;display:block;margin:10px 0}.hidden{display:none!important}#message{padding:12px;margin-bottom:16px;background:#fff;border-left:4px solid #b83d74;white-space:pre-wrap}.hint{font-size:12px;color:#685961;line-height:1.5}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}@media(max-width:720px){.layout{grid-template-columns:1fr}.menu{display:grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.item{flex-wrap:wrap}}

/* Edição de fotos e cores por produto */
.variation-section{border:1px solid #efd5df;border-radius:10px;padding:16px;background:#fff9fb}.variation-section h3{margin:0 0 8px;color:#96335e}.variation-card{border:1px solid #ead3dd;border-radius:8px;padding:14px;margin:12px 0;background:#fff}.variation-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.variation-head strong{color:#96335e}.variation-photos{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.variation-photo{width:112px;max-width:100%;border:1px solid #ead3dd;background:#fff;padding:5px;border-radius:5px}.variation-photo img{width:100px;height:100px;max-width:100%;object-fit:cover;border-radius:4px}.variation-photo .mini-actions{display:flex;justify-content:center;gap:4px;margin-top:5px}.variation-photo button{font-size:11px;padding:5px 6px}.variation-pending{font-size:12px;background:#fff0f5;padding:6px 8px;border-radius:4px;margin:5px 0}.variation-url{display:flex;gap:8px;align-items:center}.variation-url input{min-width:0;flex:1}.variation-section .actions button{font-size:12px}.variation-upload{display:block}.variation-empty{font-size:12px;color:#77636c;font-style:italic}.wide .hint{margin-top:6px}
</style></head><body><header><div><h1>Ana Júlia Modas</h1><small>Painel administrativo</small></div><div><a href="/" style="color:white;margin-right:12px">Ver loja</a><button id="logout" class="secondary hidden">Sair</button></div></header><main><div id="message" class="hidden"></div>
<section class="panel" id="login"><h2>Acesso administrativo</h2><p class="hint">Entre com o usuário autorizado do Supabase. A autenticação e as permissões são verificadas no servidor.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button>Entrar</button></div></form></section>
<div id="workspace" class="layout hidden"><nav class="menu" id="menu"><button class="active" data-tab="produtos">Produtos</button><button data-tab="categorias">Categorias</button><button data-tab="conteudo">Banners e Sobre Nós</button><button data-tab="clientes">Fotos de clientes</button><button data-tab="depoimentos">Depoimentos</button></nav><div><section class="panel"><h2 id="title">Produtos</h2><form id="editor"><div id="fields" class="grid"></div><div class="actions"><button type="submit">Salvar</button><button id="clear" type="button" class="secondary">Novo / Limpar</button></div></form></section><section class="panel"><h2>Itens cadastrados</h2><div id="items"></div></section></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/supabase-config.js"></script><script>
(()=>{'use strict';
const ADMIN='578d9805-60e5-42d3-976e-339424f55aa7';
const URL=window.LOJA_SUPABASE_URL,KEY=window.LOJA_SUPABASE_ANON_KEY;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null, tab='produtos', data=[], editId=null, categorias=[];
let draftVariations=[];const MAX_GALLERY_PHOTOS=10;
const specs={produtos:{table:'loja_produtos',fields:[['nome','Nome','text',true],['categoria','Categoria','category',true],['preco','Preço (R$)','number'],['tamanhos','Tamanhos disponíveis','text'],['descricao','Descrição','textarea'],['imagem_url','Foto principal (capa)','upload'],['destaque','Destaque / promoção','check'],['ativo','Produto publicado','check']]},categorias:{table:'loja_categorias',fields:[['nome','Nome da categoria','text',true],['ordem','Ordem de exibição','number']]},conteudo:{table:'loja_conteudo',fields:[['chave','Área do site','select',true],['valor','Texto ou imagem','textarea']]},clientes:{table:'loja_clientes',fields:[['nome','Nome da cliente','text'],['imagem_url','Fotografia da cliente','upload',true],['legenda','Legenda','textarea'],['publicado','Publicar fotografia','check']]},depoimentos:{table:'loja_depoimentos',fields:[['nome','Nome','text',true],['mensagem','Depoimento','textarea',true],['aprovado','Aprovado para publicação','check']]}};
const contentOptions=['hero_titulo','hero_texto','hero_imagem','sobre_titulo','sobre_texto','sobre_imagem','banner_titulo','banner_texto','banner_imagem'];
function notice(msg){$('message').textContent=msg;$('message').classList.remove('hidden')}
function configOk(){return URL&&KEY&&!URL.startsWith('COLE_')&&!KEY.startsWith('COLE_')&&window.supabase}
async function current(){const {data:{user},error}=await db.auth.getUser();if(error||!user||user.id!==ADMIN){$('workspace').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');return false}$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('logout').classList.remove('hidden');return true}
async function loadCategories(){const {data:rows,error}=await db.from('loja_categorias').select('nome,ordem').order('ordem',{ascending:true});if(error)throw Error('Falha ao carregar as categorias: '+error.message);categorias=rows||[]}
async function load(){if(!await current())return;const spec=specs[tab];try{if(tab==='produtos'||tab==='categorias')await loadCategories()}catch(err){notice(err.message);if(tab==='produtos')return}const {data:rows,error}=await db.from(spec.table).select('*').order(tab==='conteudo'?'chave':tab==='categorias'?'ordem':'id',{ascending:true});if(error){notice('Falha na consulta: '+error.message);return}data=rows||[];form();list()}
function form(row={}){editId=tab==='conteudo'?(row.chave||null):(row.id??null);$('title').textContent={produtos:'Produtos',categorias:'Categorias',conteudo:'Banners e Sobre Nós',clientes:'Fotos de clientes',depoimentos:'Depoimentos'}[tab];$('fields').innerHTML=specs[tab].fields.map(([key,label,type,required])=>{let value=row[key]??'';let body=type==='textarea'?`<textarea id="f_${key}" ${required?'required':''}>${esc(value)}</textarea>`:type==='category'?`<select id="f_${key}" ${required?'required':''}><option value="">Selecione uma categoria</option>${categorias.map(c=>`<option value="${esc(c.nome)}" ${value===c.nome?'selected':''}>${esc(c.nome)}</option>`).join('')}${value&&!categorias.some(c=>c.nome===value)?`<option value="${esc(value)}" selected>${esc(value)} (categoria antiga)</option>`:''}</select>${!categorias.length?'<small class="hint">Cadastre primeiro uma categoria na aba Categorias.</small>':''}`:type==='select'?`<select id="f_${key}" required>${contentOptions.map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='check'?`<label class="check"><input id="f_${key}" type="checkbox" ${value?'checked':''}> Sim</label>`:type==='upload'?`<input id="f_${key}" type="url" placeholder="URL da imagem (opcional)" value="${esc(value)}"><input id="up_${key}" type="file" accept="image/jpeg,image/png,image/webp"><small class="hint">Envie JPEG/PNG/WebP de até 5 MB. Para fotos de clientes, obtenha autorização antes de publicar.</small>${value?`<img class="preview" src="${esc(value)}" alt="Prévia">`:''}`:`<input id="f_${key}" type="${type}" ${type==='number'?'step="'+(key==='preco'?'0.01':'1')+'" min="0"':''} value="${esc(value)}" ${required?'required':''}>`;return `<div class="${type==='textarea'?'wide':''}"><label for="f_${key}">${esc(label)}</label>${body}</div>`}).join('');if(tab==='produtos'){draftVariations=parseVariations(row.variacoes);$('fields').insertAdjacentHTML('beforeend',`<div class="wide variation-section"><h3>Galeria de fotos por cor</h3><p class="hint">Cada cor pode ter até 10 fotos. Cadastre uma única opção, mesmo sem informar a cor, para criar apenas uma galeria. A primeira foto da primeira opção será a capa do produto. Produtos antigos continuam funcionando.</p><div id="variationCards"></div><button type="button" class="secondary" data-variation-action="add">+ Adicionar cor / galeria</button></div>`);drawVariations()}}

function parseVariations(value){if(typeof value==='string'){try{value=JSON.parse(value)}catch{value=[]}}return (Array.isArray(value)?value:[]).filter(v=>v&&typeof v==='object').map(v=>({cor:String(v.cor??''),tamanhos:String(v.tamanhos??''),fotos:Array.isArray(v.fotos)?v.fotos.filter(x=>typeof x==='string'):[],pending:[]}))}
function currentVariationText(){document.querySelectorAll('.variation-card').forEach(c=>{const i=Number(c.dataset.vi);if(draftVariations[i]){draftVariations[i].cor=c.querySelector('.variation-color').value;draftVariations[i].tamanhos=c.querySelector('.variation-sizes').value}})}
function drawVariations(){const root=$('variationCards');if(!root)return;root.innerHTML=draftVariations.map((v,i)=>`<div class="variation-card" data-vi="${i}"><div class="variation-head"><strong>Cor / galeria ${i+1}</strong><div class="actions"><button type="button" class="secondary" data-variation-action="move-up" data-vi="${i}" ${i===0?'disabled':''}>↑</button><button type="button" class="secondary" data-variation-action="move-down" data-vi="${i}" ${i===draftVariations.length-1?'disabled':''}>↓</button><button type="button" class="danger" data-variation-action="remove" data-vi="${i}">Remover cor</button></div></div><div class="grid"><div><label>Cor (ex.: Rosa, Preto, Azul)</label><input class="variation-color" placeholder="Deixe vazio se for uma cor única" value="${esc(v.cor)}"></div><div><label>Tamanhos desta cor</label><input class="variation-sizes" placeholder="Ex.: P, M, G ou 38, 40, 42" value="${esc(v.tamanhos)}"></div></div><label>Fotos desta cor (${v.fotos.length+v.pending.length}/${MAX_GALLERY_PHOTOS})</label><div class="variation-photos">${v.fotos.map((url,j)=>`<div class="variation-photo"><img src="${esc(url)}" alt="Foto ${j+1}"><div class="mini-actions"><button type="button" class="secondary" data-variation-action="photo-left" data-vi="${i}" data-pi="${j}" ${j===0?'disabled':''}>←</button><button type="button" class="secondary" data-variation-action="photo-right" data-vi="${i}" data-pi="${j}" ${j===v.fotos.length-1?'disabled':''}>→</button><button type="button" class="danger" data-variation-action="photo-remove" data-vi="${i}" data-pi="${j}">×</button></div></div>`).join('')}</div>${v.pending.map((f,j)=>`<div class="variation-pending">Aguardando salvar: ${esc(f.name)} <button type="button" class="danger" data-variation-action="pending-remove" data-vi="${i}" data-pi="${j}">Excluir</button></div>`).join('')}<label>Selecionar várias fotos do computador</label><input class="variation-upload" type="file" multiple accept="image/jpeg,image/png,image/webp" data-variation-files="${i}"><small class="hint">JPG, PNG ou WebP, máximo de 5 MB cada. As fotos serão enviadas ao clicar em Salvar.</small><label>Ou adicionar imagem por URL</label><div class="variation-url"><input class="variation-url-input" type="url" placeholder="https://..." aria-label="URL da foto"><button type="button" class="secondary" data-variation-action="url" data-vi="${i}">Adicionar URL</button></div><div class="actions"><button type="button" class="secondary" data-variation-action="use-cover" data-vi="${i}">Usar a foto principal desta peça</button></div></div>`).join('')||'<p class="variation-empty">Nenhuma galeria adicional. A foto principal cadastrada continuará aparecendo normalmente.</p>'}
function checkPhotoFile(file){if(file.size>5*1024*1024)throw Error('A foto "'+file.name+'" ultrapassa 5 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formato de foto não permitido: '+file.name)}
function checkHttpUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)}catch{return false}}
async function uploadVariationFile(file){checkPhotoFile(file);const extension=file.type==='image/jpeg'?'jpg':file.type==='image/png'?'png':'webp';const path=`produtos/${crypto.randomUUID()}.${extension}`;const {error}=await db.storage.from('produtos').upload(path,file,{upsert:false,contentType:file.type});if(error)throw Error('Erro ao enviar '+file.name+': '+error.message);return db.storage.from('produtos').getPublicUrl(path).data.publicUrl}
$('fields').addEventListener('change',e=>{const input=e.target.closest('[data-variation-files]');if(!input)return;currentVariationText();const i=Number(input.dataset.variationFiles),v=draftVariations[i];if(!v)return;try{const files=Array.from(input.files||[]);files.forEach(checkPhotoFile);if(v.fotos.length+v.pending.length+files.length>MAX_GALLERY_PHOTOS)throw Error(`Máximo de ${MAX_GALLERY_PHOTOS} fotos por cor.`);v.pending.push(...files);drawVariations()}catch(err){notice(err.message);input.value=''}});
$('fields').addEventListener('click',e=>{const button=e.target.closest('[data-variation-action]');if(!button)return;currentVariationText();const action=button.dataset.variationAction,i=Number(button.dataset.vi),j=Number(button.dataset.pi),v=draftVariations[i];if(action==='add'){draftVariations.push({cor:'',tamanhos:'',fotos:[],pending:[]})}else if(!v)return;else if(action==='remove'){if(!confirm('Remover esta cor e suas fotos da galeria?'))return;draftVariations.splice(i,1)}else if(action==='move-up'&&i>0){[draftVariations[i-1],draftVariations[i]]=[draftVariations[i],draftVariations[i-1]]}else if(action==='move-down'&&i<draftVariations.length-1){[draftVariations[i+1],draftVariations[i]]=[draftVariations[i],draftVariations[i+1]]}else if(action==='photo-remove'){v.fotos.splice(j,1)}else if(action==='pending-remove'){v.pending.splice(j,1)}else if(action==='photo-left'&&j>0){[v.fotos[j-1],v.fotos[j]]=[v.fotos[j],v.fotos[j-1]]}else if(action==='photo-right'&&j<v.fotos.length-1){[v.fotos[j+1],v.fotos[j]]=[v.fotos[j],v.fotos[j+1]]}else if(action==='url'){const input=button.closest('.variation-card').querySelector('.variation-url-input'),url=input.value.trim();if(!checkHttpUrl(url)){notice('Digite uma URL de imagem válida começando por https://');return}if(v.fotos.length+v.pending.length>=MAX_GALLERY_PHOTOS){notice(`Máximo de ${MAX_GALLERY_PHOTOS} fotos por cor.`);return}v.fotos.push(url)}else if(action==='use-cover'){const url=$('f_imagem_url').value.trim();if(!checkHttpUrl(url)){notice('Primeiro informe uma URL no campo Foto principal. Se tiver selecionado um arquivo, salve a foto principal antes de reutilizá-la.');return}if(v.fotos.includes(url))return;if(v.fotos.length+v.pending.length>=MAX_GALLERY_PHOTOS){notice(`Máximo de ${MAX_GALLERY_PHOTOS} fotos por cor.`);return}v.fotos.unshift(url)}drawVariations()});
async function prepareVariations(){currentVariationText();const n=draftVariations.length;const names=new Set();const complete=[];for(const v of draftVariations){const cor=v.cor.trim();if(n>1&&!cor)throw Error('Informe o nome da cor em todas as opções quando houver mais de uma.');const unique=cor.toLocaleLowerCase('pt-BR');if(n>1&&names.has(unique))throw Error('Existem duas cores com o mesmo nome: '+cor);names.add(unique);if(!v.fotos.length&&!v.pending.length)throw Error('Adicione ao menos uma foto na galeria'+(cor?' da cor '+cor:'')+'.');if(v.fotos.length+v.pending.length>MAX_GALLERY_PHOTOS)throw Error(`Máximo de ${MAX_GALLERY_PHOTOS} fotos por cor.`);const urls=[...v.fotos];for(const f of v.pending){const url=await uploadVariationFile(f);urls.push(url)}complete.push({cor,tamanhos:v.tamanhos.trim(),fotos:urls})}return complete}

function list(){$('items').innerHTML=data.map((r,i)=>`<div class="item"><div>${r.imagem_url?`<img src="${esc(r.imagem_url)}" alt="">`:''}<strong>${esc(r.nome||r.chave||'Registro')}</strong><small>${esc(r.categoria||r.legenda||r.mensagem||r.valor||'')}${r.preco!=null?' · R$ '+Number(r.preco).toFixed(2):''}</small></div><div class="actions"><button type="button" data-edit="${i}" class="secondary">Editar</button><button type="button" data-delete="${i}" class="danger">Excluir</button></div></div>`).join('')||'<p class="hint">Nenhum registro cadastrado.</p>'}
async function upload(field){const el=$('up_'+field);if(!el||!el.files.length)return $('f_'+field).value.trim()||null;const file=el.files[0];if(file.size>5*1024*1024)throw Error('Imagem acima de 5 MB');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Formato não permitido');const path=`${tab}/${crypto.randomUUID()}.${file.type.split('/')[1]}`;const bucket=tab==='produtos'?'produtos':'Loja';const {error}=await db.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!db)return;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){notice('Login não autorizado: '+error.message);return}if(await current()){notice('Acesso autorizado.');load()}else{await db.auth.signOut();notice('Este usuário não possui permissão administrativa.')}};
$('logout').onclick=async()=>{await db.auth.signOut();await current()};
$('menu').onclick=e=>{const btn=e.target.closest('[data-tab]');if(!btn)return;tab=btn.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));load()};
$('clear').onclick=()=>form();
$('editor').onsubmit=async e=>{e.preventDefault();const saveButton=$('editor').querySelector('button[type=submit]');saveButton.disabled=true;try{if(!await current())throw Error('Sessão não autorizada');const spec=specs[tab],row={};const galleries=tab==='produtos'?await prepareVariations():null;for(const [key,,type]of spec.fields){let val=type==='check'?$('f_'+key).checked:$('f_'+key).value.trim();if(type==='upload')val=await upload(key);if(type==='number')val=val===''?null:Number(val);row[key]=val}if(tab==='produtos'){row.variacoes=galleries;if(galleries.length)row.imagem_url=galleries[0].fotos[0]}const table=db.from(spec.table);let q=editId!==null?table.update(row).eq(tab==='conteudo'?'chave':'id',editId):table.insert(row);const {error}=await q;if(error)throw error;notice('Alterações salvas no Supabase.');await load()}catch(err){notice('Não foi possível salvar: '+err.message)}finally{saveButton.disabled=false}};
$('items').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){form(data[+edit.dataset.edit]);window.scrollTo({top:0,behavior:'smooth'});return}if(del){if(!await current())return;const row=data[+del.dataset.delete];if(!confirm('Excluir este registro?'))return;const {error}=await db.from(specs[tab].table).delete().eq(tab==='conteudo'?'chave':'id',tab==='conteudo'?row.chave:row.id);if(error)notice(error.message);else{notice('Registro excluído.');load()}}};
if(!configOk()){notice('Antes de usar o painel, configure supabase-config.js com a Project URL e a chave publishable/anon do projeto Supabase.');$('loginForm').querySelector('button').disabled=true;return}
db=window.supabase.createClient(URL,KEY);current().then(ok=>{if(ok)load()});
})();
</script></body></html>
